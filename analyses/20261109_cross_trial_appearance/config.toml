# Target runs of analyses/20261109_unreviewed_identity_candidates. The crops are
# read from the local staged run (the share runs at about 10 MB/s) and their
# SHA-256 is checked against the run's prepare provenance and the shared copy's
# staged_copy_manifest.json before use. Their own per-recording encoder names
# (evaluation/) are read for the consistency comparison only.
[targets."20260109_K_2_1_FCMC"]
run = "staging:20260109_K_2_1_FCMC/appearance_unrev_20261109_k21"
