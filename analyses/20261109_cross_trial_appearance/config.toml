clean_run = "data:work/appearance/20251225_K_1_3_FCMC/appearance_six_20261108_k13"

[sources.P_1]
model_run = "data:work/appearance/20260113_P_1_2_FCMC/appearance_group_20261108_p12"
sanity_clean_run = "staging:20260113_P_1_2_FCMC/appearance_six_20261108_p12"
