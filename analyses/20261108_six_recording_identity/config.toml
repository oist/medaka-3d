# Fixed inputs and declared settings of the six-recording identity study.
# Paths are relative to the data parent (parent of the configured raw_data_dir)
# unless absolute. Registered 2026-11-08 before any score existed.
# On 2026-11-09, staged input paths were replaced with the fixed shared copies
# after checking all 24 N/S/G candidate hashes against staged-copy manifests.
# Training stages resolve their local root through paths.local.toml.

# r1 (2026-11-08, same day) was discarded before any appearance score was recorded:
# it read the review onto the production chain by slot index, but the P_1_1
# appearance run consumes the 2026-11-02 rerun chain, whose slots differ.
run_id = "six_identity_20261108_r2"
output = "work/six_recording_identity"
lambda_mm = 0.767
analysis_start_s = 300.0
labels = ["F", "M1", "M2"]

[matching]
# Package positions must coincide with the chain's slot of the same index.
same_slot_max_mm = 1.0
# Jingyi pectoral positions to chain slots, the inherited rule.
jingyi_max_distance_mm = 5.0
jingyi_min_margin_mm = 2.0
# Female clicks to detections, as in Registration 4 of the appearance lab.
female_match_px = 5.0

[quantities]
pair_distance_equal_mm = 2.0
contact_distance_mm = 15.0
contact_min_duration_s = 0.1
contact_merge_gap_s = 0.1
episode_attribution_min_fraction = 0.5
max_wrong_fraction_of_named = 0.01
min_named_fraction = 0.9

[groups]
K_1 = ["20251225_K_1_1_FCMC", "20251225_K_1_2_FCMC", "20251225_K_1_3_FCMC"]
P_1 = ["20260112_P_1_1_FCMC", "20260113_P_1_2_FCMC", "20260112_P_1_3_FCMC"]

[recordings."20251225_K_1_1_FCMC"]
