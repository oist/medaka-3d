lab = "labs/20261106_contrastive_appearance_link"
lambda_mm = 0.767
note = "Six-recording identity study, per-group variant: one encoder per trio trained on the pooled clean crops of its three recordings (analyses/20261108_six_recording_identity/train_group_encoder.py), then Registration 4's naming, bridging and gap steps per recording. Each run reuses its recording's prepared crops; evaluate writes identity tracks and label-free diagnostics only."

[run_ids]
g_k11 = "appearance_group_20261108_k11"
g_k12 = "appearance_group_20261108_k12"
g_k13 = "appearance_group_20261108_k13"
g_p11 = "appearance_group_20261108_p11"
g_p12 = "appearance_group_20261108_p12"
g_p13 = "appearance_group_20261108_p13"

[groups]
K_1 = ["g_k11", "g_k12", "g_k13"]
P_1 = ["g_p11", "g_p12", "g_p13"]

[g_k11]
experiment = "20251225_K_1_1_FCMC"
output_root = "appearance_staging_dir"
output = "20251225_K_1_1_FCMC"
crop_source = "prepared_run"
prepared_run = "appearance_six_20261108_k11"

[g_k12]
experiment = "20251225_K_1_2_FCMC"
output = "work/appearance/20251225_K_1_2_FCMC"
crop_source = "prepared_run"
prepared_run = "appearance_clean_20261107_k12"

[g_k13]
experiment = "20251225_K_1_3_FCMC"
output_root = "appearance_staging_dir"
output = "20251225_K_1_3_FCMC"
crop_source = "prepared_run"
prepared_run = "appearance_six_20261108_k13"

[g_p11]
experiment = "20260112_P_1_1_FCMC"
output = "jingyi/P-1-1"
crop_source = "prepared_run"
prepared_run = "appearance_clean_20261107_r1"

[g_p12]
experiment = "20260113_P_1_2_FCMC"
output_root = "appearance_staging_dir"
output = "20260113_P_1_2_FCMC"
crop_source = "prepared_run"
prepared_run = "appearance_six_20261108_p12"

[g_p13]
experiment = "20260112_P_1_3_FCMC"
output_root = "appearance_staging_dir"
output = "20260112_P_1_3_FCMC"
crop_source = "prepared_run"
prepared_run = "appearance_six_20261108_p13"

[crops]
frame_step = 8
out_px = 64

[train]
encoder = "cnn4"
pairs = 128
seed = 20261106
threads_per_model = 12
max_steps = 6000
eval_every = 100
validation_crops = 3000
patience = 30
target = 0.91
target_patience = 2
cross_pairs = 3000

[train.models]
top = ["top_cam"]
side = ["side1_cam", "side2_cam"]

[gap]
alpha = 0.25
posterior = 0.99

[evaluate]
end_window_s = 3.0
min_reference_coverage = 0.5
max_wrong_fraction_of_named = 0.01
min_named_fraction = 0.9
figure_evaluations = [0, 1, 3, 10]
