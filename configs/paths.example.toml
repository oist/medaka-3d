[paths]
# Copy this file to configs/paths.local.toml and edit for your machine.
# paths.local.toml is gitignored. Never hardcode drive letters in code.
#
# Every directory below is checked for existence at load time. If a network
# share is not mounted, mount it — do not edit this file to point elsewhere.

# --- Required ---------------------------------------------------------------

# Root holding one folder per recording session, each with
# top_cam/ side1_cam/ side2_cam/ containing a single .mp4.
raw_data_dir = "Z:\\StephensU\\medaka\\medaka_202512"

# Curated inherited assets: trained models, training labels, ground truth.
# Must contain MANIFEST.json. See docs/ASSET_MANIFEST.md.
asset_root = "Z:\\StephensU\\medaka\\assets"

# This machine's scratch for pipeline outputs. Created if absent.
work_dir = "Z:\\StephensU\\medaka\\work"

# --- Optional ---------------------------------------------------------------

# SLEAP inference output, one subfolder per experiment.
sleap_output_dir = "Z:\\StephensU\\medaka\\sleap_output"

# Frozen archive of the retired medaka-mating-pipeline repo.
archive_dir = "Z:\\StephensU\\medaka\\archive\\medaka-mating-pipeline"

# Manual BORIS ethograms, one CSV per experiment. Currently on Google Drive,
# which is a sync client and not archival storage — prefer the copy under
# asset_root/groundtruth/boris/ once it exists.
# boris_events_dir = "G:\\.shortcut-targets-by-id\\...\\boris_events"
