[project]
name = "medaka3d"
version = "0.0.0"
description = "3-camera 3D behaviour tracking for medaka mating experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# TODO(license): undecided. The retired repo carried a placeholder LICENSE that
# was never filled in. Choose one before any external sharing.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medaka3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The experiment sheet genuinely contains full-width commas (Japanese IME);
# these fixtures reproduce it byte-for-byte on purpose.
"tests/test_cohort.py" = ["RUF001"]
