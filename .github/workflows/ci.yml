name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Labs expire on a date, so the build must be able to start failing without
    # anyone pushing. A weekly run turns an expiry into a notification.
    - cron: "0 8 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        # Use the version pinned in .python-version.
        run: uv python install

      - name: Install
        run: uv sync --locked --extra dev --extra analysis

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format check
        run: uv run --no-sync ruff format --check .

      - name: Test
        # Includes the structural rules in tests/test_labs.py: production must
        # not import labs/, and an expired lab with no RESULT.md fails the build.
        run: uv run --no-sync pytest -q
